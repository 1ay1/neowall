name: Quality

# Sanitizers + static analysis. This workflow is the proof that the
# concurrency and memory-safety claims hold: the test suite runs under
# AddressSanitizer/UBSan and ThreadSanitizer, and the whole tree is swept by
# clang's static analyzer and clang-tidy.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Cheap, fast gate: meson.build owns the version; flake.nix and
  # packaging/PKGBUILD are derived from it. Without this the three drifted to
  # 0.5.2 / 0.5.0 / 0.4.7 and downstream packages silently shipped stale
  # metadata. scripts/version.sh sync fixes any mismatch.
  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every version reference agrees with meson.build
        run: ./scripts/version.sh check
      - name: No unused functions
        run: ./scripts/check-unused.sh

  sanitizers:
    name: ASan + UBSan (unit tests)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git meson ninja wayland wayland-protocols \
            egl-wayland mesa libpng libjpeg-turbo libx11 libxrandr libxkbcommon clang \
            sway xorg-server-xvfb python

      - uses: actions/checkout@v4
      - name: Configure (ASan + UBSan)
        run: meson setup build-asan -Dwerror=true -Db_sanitize=address,undefined -Db_lundef=false --buildtype=debug

      - name: Build
        run: ninja -C build-asan

      - name: Run unit tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          meson test -C build-asan --print-errorlogs
          # mesa, sway and Xvfb are installed here, so the GL tests and both
          # end-to-end runs must really run, not skip.
          python3 - <<'EOF'
          import json, sys
          must_run = {"neowall:multipass_gl", "neowall:output_render",
                      "neowall:e2e_wayland", "neowall:e2e_kde", "neowall:e2e_x11"}
          seen = {}
          for line in open("build-asan/meson-logs/testlog.json"):
              t = json.loads(line)
              if t["name"] in must_run:
                  seen[t["name"]] = t["result"]
          print(seen)
          sys.exit(0 if set(seen) == must_run and all(r == "OK" for r in seen.values()) else 1)
          EOF

  threadsanitizer:
    name: ThreadSanitizer (concurrency tests)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git meson ninja wayland wayland-protocols \
            egl-wayland mesa libpng libjpeg-turbo libx11 libxrandr libxkbcommon sway \
            xorg-server-xvfb

      - uses: actions/checkout@v4

      - name: Configure (TSan)
        run: meson setup build-tsan -Dwerror=true -Db_sanitize=thread -Db_lundef=false --buildtype=debug

      - name: Build
        run: ninja -C build-tsan

      - name: Run every test under TSan, including the whole daemon
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: meson test -C build-tsan --print-errorlogs

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git meson ninja wayland wayland-protocols \
            egl-wayland mesa libpng libjpeg-turbo libx11 libxrandr libxkbcommon gcovr
      - uses: actions/checkout@v4
      - run: meson setup build-cov -Db_coverage=true --buildtype=debug
      - run: ninja -C build-cov
      - run: meson test -C build-cov --print-errorlogs
      - name: Report
        run: |
          gcovr -r . build-cov --filter src/ --exclude 'src/terminal/vendor/' \
            --txt-summary --txt coverage.txt --html-details coverage/index.html
          tail -n 30 coverage.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  fuzz:
    name: libFuzzer (untrusted-input parsers)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git meson ninja wayland wayland-protocols \
            egl-wayland mesa libpng libjpeg-turbo libx11 libxrandr libxkbcommon clang

      - uses: actions/checkout@v4

      - name: Configure
        run: CC=clang meson setup build-fuzz -Dfuzz=true -Db_sanitize=address,undefined -Db_lundef=false

      - name: Build
        run: ninja -C build-fuzz fuzz_vibe fuzz_multipass fuzz_exif fuzz_terminal fuzz_image fuzz_glsl

      - name: Fuzz each parser for 60s
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          mkdir -p crashes
          for f in vibe multipass exif terminal image glsl; do
            mkdir -p corpus/$f
            # start from the checked-in seeds where there are some
            case $f in
              image) cp tests/fixtures/images/* corpus/$f/ ;;
              glsl|multipass) cp examples/shaders/*.glsl corpus/$f/ ;;
            esac
            echo "== $f"
            ./build-fuzz/fuzz_$f -max_total_time=60 -artifact_prefix=crashes/$f- corpus/$f
          done

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashes
          path: crashes/

  static-analysis:
    name: clang static analyzer + clang-tidy
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git meson ninja wayland wayland-protocols \
            egl-wayland mesa libpng libjpeg-turbo libx11 libxrandr libxkbcommon clang

      - uses: actions/checkout@v4

      - name: scan-build (clang static analyzer)
        run: |
          meson setup build-scan
          ninja -C build-scan scan-build || \
            scan-build --status-bugs ninja -C build-scan

      - name: clang-tidy on changed-ish source
        run: |
          meson setup build-tidy
          # Generate compile_commands.json for clang-tidy.
          ninja -C build-tidy
          # Run tidy over our own source only (not generated protocol code).
          run-clang-tidy -p build-tidy -quiet \
            $(git ls-files 'src/**/*.c' | grep -v protocols) || true

  gcc-analyzer:
    name: gcc -fanalyzer (complementary static analysis)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git meson ninja wayland wayland-protocols \
            egl-wayland mesa libpng libjpeg-turbo libx11 libxrandr libxkbcommon gcc

      - uses: actions/checkout@v4

      - name: Configure with -fanalyzer
        # gcc -fanalyzer catches a different class of bugs than clang's static
        # analyzer (taint, double-free, leak across paths). Promoted to a
        # warning-only check rather than gating merges — the analyzer still
        # has known false-positives on complex code. Re-enable -Werror once
        # the noise floor is zero.
        run: |
          meson setup build-analyzer \
            -Dc_args='-fanalyzer -Wno-analyzer-malloc-leak'

      - name: Build (report findings without failing)
        run: ninja -C build-analyzer 2>&1 | tee analyzer.log || true

      - name: Summarise analyzer findings
        run: |
          # Print only -fanalyzer lines for a clean signal.
          grep -E 'analyzer-' analyzer.log | sort -u | head -200 || \
            echo 'No -fanalyzer findings'

  format-check:
    name: clang-format
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git clang

      - uses: actions/checkout@v4

      - name: Verify formatting
        run: |
          clang-format --version
          # Fail if any tracked C source would be reformatted.
          fail=0
          for f in $(git ls-files 'src/**/*.c' 'src/**/*.h' 'include/**/*.h' | grep -v protocols); do
            if ! clang-format --dry-run --Werror "$f" 2>/dev/null; then
              echo "needs formatting: $f"
              fail=1
            fi
          done
          exit $fail
