name: Packaging freshness

# Downstream packages going stale is a silent failure: the release succeeds,
# but AUR keeps serving an old version and nobody notices for months (that is
# exactly how neowall-git ended up pinned at 0.4.6 while upstream was 0.5.2).
#
# This workflow is the watchdog. It compares the AUR packages against the
# latest GitHub release every day and opens an issue when they diverge, and it
# can re-run the AUR publish on demand without cutting a new release.

on:
  schedule:
    - cron: "17 6 * * *"   # daily, off the hour to dodge scheduler congestion
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-aur:
    name: Compare AUR against the latest release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest released version
        id: latest
        run: |
          # The newest non-draft, non-prerelease tag on this repo.
          LATEST=$(curl -fsSL "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" \
                   | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -1)
          if [ -z "$LATEST" ]; then
            echo "no published release yet; nothing to compare"
            echo "SKIP=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "SKIP=false" >> "$GITHUB_OUTPUT"
          echo "TAG=$LATEST"          >> "$GITHUB_OUTPUT"
          echo "VERSION=${LATEST#v}"  >> "$GITHUB_OUTPUT"
          echo "latest release: $LATEST"

      - name: Query the AUR
        if: steps.latest.outputs.SKIP == 'false'
        id: aur
        run: |
          # NOTE: do NOT use the RPC (/rpc/v5/info) as the source of truth here.
          # Its package index lags a push by a long and unpredictable interval
          # (observed >10 minutes), so a freshness check built on it reports
          # drift that was already fixed and files false-alarm issues. A
          # watchdog that cries wolf gets muted, which defeats the point.
          #
          # cgit serves the repository contents directly, but its `plain` view
          # is CACHED for a short window (observed ~60s of serving the previous
          # .SRCINFO after a successful push). That is far better than the RPC,
          # but still enough to misreport a release that just published, so a
          # disagreement is re-checked against the git repository itself (see
          # the confirm step below) before anything is filed.
          fetch_srcinfo_ver() {
            pkg=$1
            url="https://aur.archlinux.org/cgit/aur.git/plain/.SRCINFO?h=$pkg&cachebust=$(date +%s)"
            body=$(curl -fsSL -H 'Cache-Control: no-cache' "$url" 2>/dev/null) || { echo "ABSENT"; return; }
            [ -n "$body" ] || { echo "ABSENT"; return; }
            ver=$(printf '%s\n' "$body" | sed -n 's/^[[:space:]]*pkgver = //p' | head -1)
            rel=$(printf '%s\n' "$body" | sed -n 's/^[[:space:]]*pkgrel = //p' | head -1)
            [ -n "$ver" ] || { echo "ABSENT"; return; }
            printf '%s-%s\n' "$ver" "${rel:-1}"
          }

          for pkg in neowall-git neowall-bin; do
            v=$(fetch_srcinfo_ver "$pkg")
            key=$(printf '%s' "$pkg" | tr 'a-z-' 'A-Z_')
            echo "$key=$v" >> "$GITHUB_OUTPUT"
            echo "$pkg: $v"
          done

      # Anything cgit reported as stale/absent gets a second opinion from the
      # git repository, which has no cache in front of it. A false alarm here
      # costs more than a missed day: a watchdog that cries wolf gets muted.
      - name: Confirm against the AUR git repositories
        if: steps.latest.outputs.SKIP == 'false'
        id: confirm
        env:
          VERSION: ${{ steps.latest.outputs.VERSION }}
          AUR_GIT: ${{ steps.aur.outputs.NEOWALL_GIT }}
          AUR_BIN: ${{ steps.aur.outputs.NEOWALL_BIN }}
        run: |
          set -u
          recheck() {
            pkg=$1
            dir=$(mktemp -d)
            if ! git clone -q --depth 1 "https://aur.archlinux.org/$pkg.git" "$dir/$pkg" 2>/dev/null; then
              echo "ABSENT"; return
            fi
            src="$dir/$pkg/.SRCINFO"
            [ -f "$src" ] || { echo "ABSENT"; return; }
            ver=$(sed -n 's/^[[:space:]]*pkgver = //p' "$src" | head -1)
            rel=$(sed -n 's/^[[:space:]]*pkgrel = //p' "$src" | head -1)
            [ -n "$ver" ] || { echo "ABSENT"; return; }
            printf '%s-%s\n' "$ver" "${rel:-1}"
          }

          for pkg in neowall-git neowall-bin; do
            key=$(printf '%s' "$pkg" | tr 'a-z-' 'A-Z_')
            case "$pkg" in
              neowall-git) cached=$AUR_GIT ;;
              *)           cached=$AUR_BIN ;;
            esac

            base=${cached%%-*}; base=${base%%.r*}
            if [ "$cached" != "ABSENT" ] && [ "$base" = "$VERSION" ]; then
              # cgit already agrees it is current; no need to clone.
              echo "$key=$cached" >> "$GITHUB_OUTPUT"
              echo "$pkg: $cached (cgit, current)"
              continue
            fi

            v=$(recheck "$pkg")
            echo "$key=$v" >> "$GITHUB_OUTPUT"
            if [ "$v" != "$cached" ]; then
              echo "$pkg: cgit said '$cached', git says '$v' (cgit cache was stale)"
            else
              echo "$pkg: $v (confirmed via git)"
            fi
          done

      - name: Report drift
        if: steps.latest.outputs.SKIP == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.latest.outputs.VERSION }}
          TAG: ${{ steps.latest.outputs.TAG }}
          AUR_GIT: ${{ steps.confirm.outputs.NEOWALL_GIT }}
          AUR_BIN: ${{ steps.confirm.outputs.NEOWALL_BIN }}
        run: |
          stale=""
          # AUR versions carry a -pkgrel suffix; compare only the pkgver part.
          gitver=${AUR_GIT%%-*}
          binver=${AUR_BIN%%-*}

          # neowall-git is a VCS package: its version tracks the last push, so
          # only flag it when its base version trails the release outright.
          case "$AUR_GIT" in
            ABSENT) stale="$stale
          - \`neowall-git\` is **missing from the AUR**" ;;
            *) if [ "${gitver%%.r*}" != "$VERSION" ]; then
                 stale="$stale
          - \`neowall-git\` is at \`$AUR_GIT\` but the latest release is \`$VERSION\`"
               fi ;;
          esac

          case "$AUR_BIN" in
            ABSENT) stale="$stale
          - \`neowall-bin\` is **missing from the AUR**" ;;
            *) if [ "$binver" != "$VERSION" ]; then
                 stale="$stale
          - \`neowall-bin\` is at \`$AUR_BIN\` but the latest release is \`$VERSION\`"
               fi ;;
          esac

          if [ -z "$stale" ]; then
            echo "AUR packages are current for $VERSION"
            exit 0
          fi

          echo "drift detected:$stale"

          TITLE="Packaging out of date for $TAG"
          # One rolling issue, not one per day. Match by TITLE only — do NOT
          # constrain to the `packaging` label: older duplicates were filed
          # unlabelled, and label-scoped search silently missed them, which is
          # how #69-73 piled up. `--search` also fuzzy-matches, so pin the
          # exact title in jq to avoid latching onto a different release's issue.
          EXISTING=$(gh issue list --state open --search "in:title $TITLE" \
            --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number" 2>/dev/null || echo "")
          BODY="The daily packaging-freshness check found downstream packages lagging the latest release (\`$TAG\`).
          $stale

          **To fix:** re-run the \`Release\` workflow's AUR step via
          \`gh workflow run release.yml -f version=$VERSION\`, or push the
          refreshed PKGBUILDs by hand.

          **Before suspecting the key:** the AUR git backend periodically goes
          into maintenance. The release job's \`Verify the AUR accepts the key\`
          step distinguishes the cases — a **warning** there (\"AUR is in
          maintenance\" / \"could not reach the AUR\") means the key is fine and
          this issue will clear itself on the next run once the AUR is back.
          Only an **error** (\"AUR rejected the SSH key\") means the
          \`AUR_SSH_PRIVATE_KEY\` secret is missing/unregistered — re-add the
          private half whose public key is registered at
          https://aur.archlinux.org/account/ .

          _Filed automatically by .github/workflows/packaging-freshness.yml_"

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --label packaging --body "$BODY" \
              || gh issue create --title "$TITLE" --body "$BODY"
          fi
